# The dsh-plugin-auto-update bundle patch.
#
# Host half (`index.js`) runs the update cycle through the profile's own
# pluginManager service. Browser half (`lib/client.js`) puts a panel on this
# bundle's page in the Plugins tab; that panel writes the volatile fields below
# through the settings service, so edits apply without a restart.
- insert:
    - id: auto-update
      name: 'dsh-plugin-auto-update'
      config:
        # Nothing is updated until this is switched on in the panel.
        enabled: false
        # ["*"] = every registry-installed bundle; or name the packages.
        packages:
          - '*'
        allowMajor: false
        allowPrerelease: false
        dryRun: false
        intervalHours: 6
        initialDelayMinutes: 1
        maxUpdatesPerRun: 5
        registry: 'https://registry.npmjs.org'
        timeoutMs: 20000
        notify: true
        logPath: '~/.dsh/plugin-auto-update.log'
